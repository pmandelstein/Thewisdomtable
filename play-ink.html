<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Wisdom Table — Sit Down, Ask Anything</title>
<meta name="description" content="Ask any question and hear how history's wisest voices would answer — together, at one table. Free and open to everyone.">
<meta property="og:title" content="The Wisdom Table — Pull up a chair with history's wisest minds">
<meta property="og:description" content="Ask anything. Hear from Socrates, the Buddha, Maya Angelou, your grandmother — all at one table.">
<meta property="og:image" content="https://wisdomtable.ai/og-image.png">
<meta property="og:url" content="https://wisdomtable.ai/play.html">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Shippori+Mincho:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F3EFE6; --surface:#FAF7F0; --ink:#1A1A1A; --muted:#6B6358; --line:rgba(26,26,26,.18);
  --gold:#1A1A1A; --gold-d:#1A1A1A; --gold-l:rgba(26,26,26,.06); --on-gold:#F3EFE6;
  --seal:#C8372D; --hl:rgba(200,55,45,.14);
  --card1:#F3EFE6; --card2:#EBE5D8;
  --serif:'Shippori Mincho',Georgia,serif;
  --sans:'Inter',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--cream);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;min-height:100vh}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;color:var(--ink)}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}

.top{display:flex;justify-content:space-between;align-items:center;padding:18px 0;border-bottom:1px solid var(--ink)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:1rem;letter-spacing:.12em;color:var(--ink);text-decoration:none}
.brand span{color:var(--ink)}
.hanko{width:30px;height:30px;background:var(--seal);color:var(--cream);font-family:var(--serif);font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;border-radius:3px;letter-spacing:0}
.top a.about{font-size:.85rem;color:var(--muted);text-decoration:none}

.hero{text-align:center;padding:56px 0 44px;position:relative}
.enso{position:absolute;left:50%;top:50%;width:250px;height:250px;transform:translate(-50%,-58%);pointer-events:none}
.hero h1,.hero p{position:relative}
.hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(2rem,7vw,3rem);line-height:1.25;position:relative}
.hero h1 em{font-style:normal;color:var(--ink);border-bottom:3px solid var(--seal)}
.hero p{color:var(--muted);margin-top:14px;font-size:1rem;letter-spacing:.04em}

.ask{background:var(--surface);border:1px solid var(--ink);border-radius:3px;padding:16px}
.ask textarea{width:100%;border:none;outline:none;resize:none;font-family:var(--serif);font-size:1.15rem;line-height:1.6;color:var(--ink);background:transparent;min-height:84px}
.ask textarea::placeholder{color:var(--muted)}

.label{font-family:var(--serif);font-size:.95rem;color:var(--ink);margin:30px 0 12px;display:flex;align-items:center;gap:10px}
.label:after{content:'';flex:1;height:1px;background:var(--line)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:transparent;border-radius:3px;padding:9px 14px;font-size:.92rem;transition:all .15s}
.chip:active{transform:scale(.97)}
.chip.on{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.theme{font-family:var(--serif);font-size:1rem;border-color:var(--ink)}
.theme:hover{background:var(--gold-l)}
.more{border-style:dashed;color:var(--muted)}

.voice-row{display:flex;gap:8px;margin-top:10px}
.voice-row input{flex:1;min-width:0;border:1px solid var(--line);border-radius:3px;padding:10px 14px;font-size:.95rem;font-family:var(--sans);background:var(--surface);color:var(--ink);outline:none}
.voice-row input:focus{border-color:var(--ink)}
.small-btn{border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:3px;padding:10px 16px;font-size:.92rem;white-space:nowrap}
.count{font-size:.85rem;color:var(--muted);margin-top:10px}

.actions{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
.go{flex:1 1 200px;white-space:nowrap;background:var(--ink);color:var(--cream);border:none;border-radius:3px;padding:17px 20px;font-family:var(--serif);font-size:1.1rem;letter-spacing:.04em}
.go:hover{background:#000}
.go:disabled{opacity:.55;cursor:default}
.surprise{flex:0 1 auto;background:transparent;border:1px solid var(--seal);color:var(--seal);border-radius:3px;padding:17px 20px;font-family:var(--serif);font-size:1rem}

.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:0;border-top:1px solid var(--line)}
.preset{text-align:left;background:transparent;border:none;border-bottom:1px solid var(--line);padding:14px 4px;color:var(--ink)}
.preset:hover b{border-bottom:2px solid var(--seal)}
.preset b{display:inline;font-family:var(--serif);font-weight:400;font-size:1.05rem}
.preset small{color:var(--muted);font-size:.82rem;line-height:1.4;display:block;margin-top:4px}

#results{scroll-margin-top:16px}
.q-show{font-family:var(--serif);font-size:1.35rem;text-align:center;margin:44px 0 22px;line-height:1.5}
.q-show:before{content:'「'}.q-show:after{content:'」'}
.loading{text-align:center;color:var(--muted);font-family:var(--serif);padding:30px 0}
.loading .dots:after{content:'';animation:dots 1.4s infinite}
@keyframes dots{0%{content:''}33%{content:'.'}66%{content:'..'}100%{content:'...'}}
.voice-card{border-top:1px solid var(--ink);padding:18px 2px 10px;animation:rise .5s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.voice-card h3{font-family:var(--serif);font-weight:700;font-size:1.08rem;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.voice-card .seal{width:26px;height:26px;background:var(--seal);color:var(--cream);font-size:13px;display:inline-flex;align-items:center;justify-content:center;border-radius:3px;font-weight:700;flex:none}
.voice-card .role{font-family:var(--sans);font-weight:400;color:var(--muted);font-size:.82rem}
.voice-card p{margin-top:10px;font-family:var(--serif);font-size:1.05rem;line-height:1.85}
.voice-card p em{font-style:normal;background:linear-gradient(transparent 62%,var(--hl) 62%)}
.card-tools{display:flex;gap:6px;margin-top:8px}
.tool{background:transparent;border:none;color:var(--muted);font-size:.85rem;padding:6px 8px;border-radius:3px}
.tool:hover{color:var(--seal)}
.after{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:24px 0 8px;padding-top:20px;border-top:1px solid var(--ink)}
.note{text-align:center;color:var(--muted);font-size:.8rem;margin:10px auto 0;max-width:520px}
.err{text-align:center;padding:24px;color:var(--muted)}

footer{text-align:center;padding:64px 0 40px;color:var(--muted);font-size:.85rem}
footer .tag{font-family:var(--serif);color:var(--ink);font-size:1.05rem;margin-bottom:12px}
footer a{color:var(--muted)}
footer .hanko{margin-bottom:14px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:var(--ink);color:var(--cream);padding:10px 18px;border-radius:3px;font-size:.9rem;transition:transform .25s;z-index:50;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <a class="brand" href="play-ink.html"><span class="hanko">智</span>The Wisdom Table</a>
    <a class="about" href="about.html">About</a>
  </header>

  <section class="hero">
    <svg class="enso" viewBox="0 0 200 200" aria-hidden="true"><path d="M150 46 C 118 18, 58 22, 36 70 C 16 114, 44 168, 96 174 C 146 180, 182 140, 176 96 C 172 72, 160 58, 146 52" fill="none" stroke="#1A1A1A" stroke-opacity=".08" stroke-width="20" stroke-linecap="round"/></svg>
    <h1>Sit down.<br><em>Ask anything.</em></h1>
    <p>History's wisest voices, at one table.</p>
  </section>

  <div class="ask">
    <textarea id="q" rows="3" placeholder="What's on your mind? Ask a real question…" maxlength="600"></textarea>
  </div>

  <div class="label">Or begin with</div>
  <div class="chips" id="themes"></div>

  <div class="label">Who sits with you</div>
  <div class="chips" id="voices"></div>
  <div class="voice-row">
    <input id="custom" placeholder="Add anyone — a poet, your grandmother…" maxlength="60">
    <button class="small-btn" id="addBtn">Add</button>
  </div>
  <div class="count" id="count"></div>

  <div class="actions">
    <button class="go" id="goBtn">Convene the Council →</button>
    <button class="surprise" id="surpriseBtn">Surprise me</button>
  </div>

  <section id="results"></section>

  <div class="label" style="margin-top:48px">Famous councils</div>
  <div class="presets" id="presets"></div>

  <footer>
    <span class="hanko">智</span>
    <div class="tag">The table is set. There is a seat for everyone.</div>
    <div>Free and open to all · <a href="about.html">About</a> · <a href="mailto:pmandelstein@gmail.com">Contact</a></div>
    <div style="margin-top:6px">A project of Liminal Arts</div>
  </footer>
</div>

<div class="toast" id="toast"></div>
<canvas id="cardCanvas" class="hidden"></canvas>

<script>
const API_URL = "https://wisdomtable.pmandelstein.workers.dev";
const MODEL = "claude-sonnet-4-6";
const MAX_VOICES = 5;

const VOICE_ROLES = {
  "The Buddha":"Buddhism","Thích Nhất Hạnh":"Zen Buddhism","Rumi":"Sufi poet","Marcus Aurelius":"Stoic emperor",
  "Viktor Frankl":"Psychiatrist, survivor","Maya Angelou":"Poet","Socrates":"Philosopher","Laozi":"Taoism",
  "Confucius":"Confucianism","Epictetus":"Stoic teacher","Mary Oliver":"Poet","Carl Sagan":"Astronomer",
  "A Hospice Nurse":"Has sat with hundreds at the end","A Zen Monk":"Zen practice","Indigenous Elder":"Indigenous wisdom",
  "Rabbi Hillel":"Judaism","Simone Weil":"Mystic philosopher","Hildegard von Bingen":"Christian mystic",
  "Bhagavad Gita":"Hindu scripture","A Neuroscientist":"Modern science","Your Grandmother":"Lived experience",
  "Mark Twain":"Humorist","Epicurus":"Philosopher of joy","Desmond Tutu":"Archbishop","Albert Einstein":"Physicist",
  "Marie Curie":"Scientist","Seneca":"Stoic","Meister Eckhart":"Christian mystic","Emily Dickinson":"Poet",
  "Benjamin Franklin":"Statesman, inventor","Julia Child":"Chef","Leonardo da Vinci":"Artist, inventor",
  "Harriet Tubman":"Freedom fighter","A Five-Year-Old":"Beginner's mind","A Bartender":"Has heard it all",
  "Shakespeare":"Playwright","Abraham Lincoln":"President","A Farmer":"Fifty years on the land","Mister Rogers":"Children's television"
};
const ALL_VOICES = Object.keys(VOICE_ROLES);
const SHOW_FIRST = 14;

const THEMES = [
  {t:"Grief", q:"How do I go on after losing someone I love?", v:["Thích Nhất Hạnh","A Hospice Nurse","Rumi"]},
  {t:"Love", q:"How do I know if this relationship is right for me?", v:["Maya Angelou","Rumi","Your Grandmother"]},
  {t:"Purpose", q:"What should I do with the rest of my life?", v:["Viktor Frankl","Mary Oliver","Marcus Aurelius"]},
  {t:"Worry", q:"How do I stop worrying about the future?", v:["Epictetus","A Zen Monk","Laozi"]},
  {t:"Forgiveness", q:"Should I forgive someone who hurt me and never apologized?", v:["The Buddha","Desmond Tutu","Marcus Aurelius"]},
  {t:"Growing older", q:"How do I grow old well?", v:["Confucius","Indigenous Elder","Mary Oliver"]},
  {t:"Work", q:"I'm unhappy in my work. Should I make a change?", v:["Bhagavad Gita","Seneca","Mark Twain"]},
  {t:"Joy", q:"Why is it so hard to just be happy?", v:["Epicurus","Thích Nhất Hạnh","Maya Angelou"]},
];

const PRESETS = [
  {name:"The Stoics' Table", d:"Marcus Aurelius, Epictetus and Seneca on staying steady", v:["Marcus Aurelius","Epictetus","Seneca"], q:"How do I stay calm when everything feels out of control?"},
  {name:"Mystics at Midnight", d:"Rumi, Hildegard and Meister Eckhart on the sacred", v:["Rumi","Hildegard von Bingen","Meister Eckhart"], q:"How do I find the sacred in an ordinary day?"},
  {name:"Science & Wonder", d:"Sagan, Curie and Einstein on meaning in a vast universe", v:["Carl Sagan","Marie Curie","Albert Einstein"], q:"Does my life matter in such a vast universe?"},
  {name:"The Kitchen Table", d:"Your grandmother, a farmer and a bartender — plain truth", v:["Your Grandmother","A Farmer","A Bartender"], q:"How do I know when to stay and when to walk away?"},
  {name:"The Unlikely Dinner Party", d:"Socrates, Julia Child, a Zen monk and Mark Twain", v:["Socrates","Julia Child","A Zen Monk","Mark Twain"], q:"What makes a life well lived?"},
  {name:"Beginner's Mind", d:"A five-year-old, Mister Rogers and Laozi", v:["A Five-Year-Old","Mister Rogers","Laozi"], q:"Why do grown-ups make everything so complicated?"},
];

const selected = new Set(["Marcus Aurelius","Thích Nhất Hạnh","Maya Angelou"]);
let showAll = false;
let lastRun = null;   // {q, voices, entries}
let busy = false;

const $ = id => document.getElementById(id);
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2000); }
function el(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }

/* ── Render controls ── */
function renderThemes(){
  const box=$('themes');
  THEMES.forEach(th=>{
    const b=el('button','chip theme',th.t);
    b.onclick=()=>{ $('q').value=th.q; setVoices(th.v); convene(); };
    box.appendChild(b);
  });
}
function renderVoices(){
  const box=$('voices'); box.innerHTML='';
  const extras=[...selected].filter(v=>!ALL_VOICES.slice(0,SHOW_FIRST).includes(v));
  const list = showAll ? [...new Set([...ALL_VOICES,...selected])] : [...new Set([...ALL_VOICES.slice(0,SHOW_FIRST),...extras])];
  list.forEach(v=>{
    const b=el('button','chip'+(selected.has(v)?' on':''),v);
    b.onclick=()=>toggleVoice(v);
    box.appendChild(b);
  });
  if(!showAll){ const m=el('button','chip more','More voices +'); m.onclick=()=>{showAll=true;renderVoices();}; box.appendChild(m); }
  const n=selected.size;
  $('count').textContent = n===0 ? 'Choose at least one voice' : `${n} at the table` + (n>=MAX_VOICES?' (that\'s the most)':'');
}
function renderPresets(){
  const box=$('presets');
  PRESETS.forEach(p=>{
    const b=el('button','preset');
    b.appendChild(el('b',null,p.name)); b.appendChild(el('small',null,p.d));
    b.onclick=()=>{ if(!$('q').value.trim()) $('q').value=p.q; setVoices(p.v); convene(); };
    box.appendChild(b);
  });
}
function toggleVoice(v){
  if(selected.has(v)) selected.delete(v);
  else { if(selected.size>=MAX_VOICES){ toast(`Up to ${MAX_VOICES} voices at one table`); return; } selected.add(v); }
  renderVoices();
}
function setVoices(arr){ selected.clear(); arr.slice(0,MAX_VOICES).forEach(v=>selected.add(v)); renderVoices(); }
function addCustom(){
  const v=$('custom').value.trim().replace(/[<>"]/g,'');
  if(!v) return;
  if(selected.size>=MAX_VOICES){ toast(`Up to ${MAX_VOICES} voices at one table`); return; }
  selected.add(v); $('custom').value=''; renderVoices();
}
function surprise(){
  // A deliberately unlikely mix: one sage, one modern or everyday voice, one wildcard
  const sages=["Socrates","The Buddha","Laozi","Confucius","Rumi","Marcus Aurelius","Hildegard von Bingen","Epicurus","Meister Eckhart","Rabbi Hillel"];
  const moderns=["Carl Sagan","Marie Curie","Albert Einstein","Maya Angelou","Mary Oliver","Viktor Frankl","Emily Dickinson","Harriet Tubman","Mister Rogers","Abraham Lincoln"];
  const wild=["A Five-Year-Old","A Bartender","Julia Child","Mark Twain","Your Grandmother","A Farmer","Benjamin Franklin","Leonardo da Vinci","Shakespeare","A Hospice Nurse"];
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  setVoices([pick(sages),pick(moderns),pick(wild)]);
  if(!$('q').value.trim()){
    const th=THEMES[Math.floor(Math.random()*THEMES.length)];
    $('q').value=th.q;
  }
  convene();
}

/* ── Parse the streamed dialogue safely into {name, role, parts:[{text,em}]} ── */
function parseEntries(raw){
  let t=raw; const i=t.search(/<h4[\s>]/i); if(i>0) t=t.slice(i);
  t=t.replace(/\*\*(.*?)\*\*/g,'$1');
  const out=[]; const re=/<h4[^>]*>([\s\S]*?)<\/h4>\s*(?:<p[^>]*>([\s\S]*?)(?:<\/p>|$))?/gi; let m;
  while((m=re.exec(t))){
    const head=textOf(m[1]); const [name,...rest]=head.split('·');
    const parts=[];
    if(m[2]){
      const doc=new DOMParser().parseFromString('<div>'+m[2]+'</div>','text/html');
      doc.body.firstChild.childNodes.forEach(n=>{
        if(n.nodeType===3) parts.push({text:n.textContent});
        else parts.push({text:n.textContent, em:n.nodeName==='EM'||n.nodeName==='STRONG'||n.nodeName==='B'});
      });
    }
    out.push({name:name.trim(), role:rest.join('·').trim(), parts});
  }
  return out;
}
function textOf(html){ return new DOMParser().parseFromString(html,'text/html').body.textContent||''; }
function plain(entry){ return entry.parts.map(p=>p.text).join('').trim(); }
function bestLine(entry){
  const hi=entry.parts.find(p=>p.em && p.text.trim().length>8);
  if(hi) return hi.text.trim();
  const sentences=plain(entry).match(/[^.!?]+[.!?]+/g)||[plain(entry)];
  return (sentences.find(s=>s.split(' ').length>=6 && s.split(' ').length<=30)||sentences[0]).trim();
}

/* ── Results rendering ── */
function renderEntries(entries, done){
  const box=$('cards');
  entries.forEach((e,idx)=>{
    let card=box.children[idx];
    if(!card){ card=el('article','voice-card'); box.appendChild(card); }
    card.innerHTML='';
    const h=el('h3'); const ini=(e.name.replace(/^(A|An|The|Your)\s+/i,'')[0]||'·'); h.appendChild(el('span','seal',ini)); h.appendChild(document.createTextNode(e.name));
    if(e.role) h.appendChild(el('span','role','· '+e.role));
    card.appendChild(h);
    const p=el('p');
    e.parts.forEach(part=>{ p.appendChild(part.em ? el('em',null,part.text) : document.createTextNode(part.text)); });
    card.appendChild(p);
    if(done){
      const tools=el('div','card-tools');
      const s=el('button','tool','↗ Share this'); s.onclick=()=>shareCard(idx);
      const c=el('button','tool','Copy'); c.onclick=()=>copyEntry(idx);
      tools.append(s,c); card.appendChild(tools);
    }
  });
}

async function convene(){
  if(busy) return;
  const q=$('q').value.trim();
  if(!q){ $('q').focus(); toast('Type a question first'); return; }
  if(selected.size===0){ toast('Choose at least one voice'); return; }
  const voices=[...selected];
  busy=true; $('goBtn').disabled=true; $('goBtn').textContent='Gathering the council…';
  stopSpeaking();

  const res=$('results'); res.innerHTML='';
  res.appendChild(el('div','q-show',q));
  const cards=el('div'); cards.id='cards'; res.appendChild(cards);
  const loading=el('div','loading'); loading.innerHTML='The council is gathering<span class="dots"></span>';
  res.appendChild(loading);
  res.scrollIntoView({behavior:'smooth',block:'start'});

  const system=`You are the Wisdom Table Council Room. You speak as the greatest wisdom voices in human history, each in their authentic voice.

CRITICAL OUTPUT RULES — follow these exactly:
- Output ONLY the formatted dialogue. No planning, reasoning, or commentary.
- No markdown. Use ONLY the HTML tags <h4>, <p> and <em> as described.
- Begin immediately with the first <h4> tag.

For each panelist, write a genuine, warm response to the person's question — 3 to 5 sentences in their actual voice, drawing on their real teachings, worldview and way of speaking. Be specific to what they actually taught, not generic wisdom. Let them occasionally nod to or gently differ from another voice at the table. Paraphrase rather than quoting long passages. If a panelist is an everyday person or archetype (a grandmother, a bartender, a five-year-old), speak plainly as that person would — it's fine to be funny or tender.

In each response, wrap the single most memorable, quotable sentence (under 25 words) in <em></em>.

Format each response as exactly:
<h4>Name · Tradition or Role</h4>
<p>Their response.</p>

Repeat this pair once per panelist, in the order given, with nothing else.`;

  let text='', entries=[];
  try{
    const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:MODEL,max_tokens:1600,stream:true,system,
        messages:[{role:'user',content:`Question: "${q}"\n\nPanelists: ${voices.join(', ')}`}]})});
    if(!r.ok || !r.body || !(r.headers.get('content-type')||'').includes('event-stream')){
      const d=await r.json();
      if(d.error) throw new Error(d.error.message||'error');
      text=d.content?.[0]?.text||'';
    } else {
      const reader=r.body.getReader(); const dec=new TextDecoder(); let buf='';
      while(true){
        const {done,value}=await reader.read(); if(done) break;
        buf+=dec.decode(value,{stream:true});
        const lines=buf.split('\n'); buf=lines.pop();
        for(const line of lines){
          if(!line.startsWith('data:')) continue;
          const payload=line.slice(5).trim(); if(!payload||payload==='[DONE]') continue;
          try{ const evt=JSON.parse(payload);
            if(evt.type==='content_block_delta' && evt.delta?.text){
              text+=evt.delta.text; entries=parseEntries(text);
              if(entries.length){ loading.classList.add('hidden'); renderEntries(entries,false); }
            }
          }catch(_){}
        }
      }
    }
    entries=parseEntries(text);
    if(!entries.length) throw new Error('empty');
    loading.remove();
    renderEntries(entries,true);
    lastRun={q,voices,entries};
    renderAfter();
  }catch(err){
    loading.remove(); cards.innerHTML='';
    const e=el('div','err','The council couldn\'t gather just now. ');
    const retry=el('button','small-btn','Try again'); retry.onclick=()=>{busy=false;convene();};
    e.appendChild(retry); res.appendChild(e);
  }
  busy=false; $('goBtn').disabled=false; $('goBtn').textContent='Convene the Council →';
}

function renderAfter(){
  const res=$('results');
  const row=el('div','after');
  const listen=el('button','small-btn','▶ Listen'); listen.id='listenBtn'; listen.onclick=toggleListen;
  const again=el('button','small-btn','Same question, new voices'); again.onclick=()=>{
    const q=$('q').value; surpriseVoicesOnly(); $('q').value=q; convene(); };
  const fresh=el('button','small-btn','Ask something new'); fresh.onclick=()=>{ $('q').value=''; window.scrollTo({top:0,behavior:'smooth'}); setTimeout(()=>$('q').focus(),400); };
  row.append(listen,again,fresh);
  res.appendChild(row);
  res.appendChild(el('div','note','Imagined from each voice\'s real teachings and way of speaking — not their actual words.'));
}
function surpriseVoicesOnly(){
  const pool=ALL_VOICES.filter(v=>!selected.has(v));
  const pick=[]; while(pick.length<3){ const v=pool.splice(Math.floor(Math.random()*pool.length),1)[0]; pick.push(v); }
  setVoices(pick);
}

/* ── Listen ── */
let speaking=false;
function stopSpeaking(){ if(window.speechSynthesis) speechSynthesis.cancel(); speaking=false; const b=$('listenBtn'); if(b) b.textContent='▶ Listen'; }
function toggleListen(){
  if(!window.speechSynthesis||!lastRun){ toast('Listening isn\'t available on this device'); return; }
  if(speaking){ stopSpeaking(); return; }
  speaking=true; $('listenBtn').textContent='■ Stop';
  const queue=lastRun.entries.map(e=>`${e.name}. ${plain(e)}`);
  let i=0;
  const next=()=>{
    if(!speaking||i>=queue.length){ stopSpeaking(); return; }
    const u=new SpeechSynthesisUtterance(queue[i++]); u.rate=.95; u.onend=next; u.onerror=next;
    speechSynthesis.speak(u);
  };
  next();
}

/* ── Copy & share ── */
function copyEntry(idx){
  const e=lastRun.entries[idx];
  const t=`"${lastRun.q}"\n\n${e.name}: ${plain(e)}\n\nAsk your own at wisdomtable.ai`;
  navigator.clipboard?.writeText(t).then(()=>toast('Copied')).catch(()=>toast('Couldn\'t copy'));
}

function wrapLines(ctx,text,maxW){
  const words=text.split(/\s+/); const lines=[]; let line='';
  words.forEach(w=>{ const test=line?line+' '+w:w; if(ctx.measureText(test).width>maxW && line){ lines.push(line); line=w; } else line=test; });
  if(line) lines.push(line); return lines;
}
async function drawCard(idx){
  const e=lastRun.entries[idx]; const quote=bestLine(e);
  const W=1080,H=1350,c=$('cardCanvas'); c.width=W; c.height=H; const ctx=c.getContext('2d');
  try{ await Promise.all([document.fonts.load('400 40px "Shippori Mincho"'),document.fonts.load('700 40px "Shippori Mincho"'),document.fonts.load('400 20px Inter')]); }catch(_){}
  const serif='"Shippori Mincho", Georgia, serif', sans='Inter, system-ui, sans-serif';
  const INK='#1A1A1A', PAPER='#F3EFE6', SEAL='#C8372D', MUTED='#6B6358';
  ctx.fillStyle=PAPER; ctx.fillRect(0,0,W,H);
  // faint ensō
  ctx.save(); ctx.strokeStyle='rgba(26,26,26,.06)'; ctx.lineWidth=60; ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(W/2,H/2+20,360,-1.05,Math.PI*1.72); ctx.stroke(); ctx.restore();
  // header rule + name
  ctx.fillStyle=INK; ctx.fillRect(90,150,W-180,2);
  ctx.textAlign='left'; ctx.font=`400 30px ${serif}`; ctx.fillText('The Wisdom Table',90,120);
  // question
  ctx.textAlign='left'; ctx.fillStyle=MUTED; ctx.font=`400 32px ${serif}`;
  const qLines=wrapLines(ctx,'「'+lastRun.q+'」',W-180).slice(0,4);
  let y=220; qLines.forEach(l=>{ ctx.fillText(l,90,y); y+=50; });
  // quote
  let size=60, ql;
  do{ ctx.font=`400 ${size}px ${serif}`; ql=wrapLines(ctx,quote,W-180); size-=4; } while(ql.length*size*1.55>640 && size>32);
  size+=4; const lh=size*1.55; let qy=Math.max(y+90,(H-ql.length*lh)/2);
  ctx.fillStyle=INK; ctx.font=`400 ${size}px ${serif}`;
  ql.forEach(l=>{ qy+=lh; ctx.fillText(l,90,qy); });
  // speaker with seal
  const sy=qy+120; const ini=(e.name.replace(/^(A|An|The|Your)\s+/i,'')[0]||'·');
  ctx.fillStyle=SEAL; ctx.fillRect(90,sy-38,52,52);
  ctx.fillStyle=PAPER; ctx.textAlign='center'; ctx.font=`700 30px ${serif}`; ctx.fillText(ini,116,sy-2);
  ctx.textAlign='left'; ctx.fillStyle=INK; ctx.font=`700 34px ${serif}`; ctx.fillText(e.name,162,sy-2);
  if(e.role){ ctx.fillStyle=MUTED; ctx.font=`400 24px ${sans}`; ctx.fillText(e.role,162,sy+34); }
  // footer
  ctx.fillStyle=INK; ctx.fillRect(90,H-170,W-180,2);
  ctx.font=`400 28px ${serif}`; ctx.fillText('Sit down. Ask anything.',90,H-110);
  ctx.fillStyle=MUTED; ctx.font=`400 24px ${sans}`; ctx.fillText('wisdomtable.ai',90,H-72);
  ctx.fillStyle=SEAL; ctx.fillRect(W-170,H-150,80,80);
  ctx.fillStyle=PAPER; ctx.textAlign='center'; ctx.font=`700 48px ${serif}`; ctx.fillText('智',W-130,H-93);
  return c;
}
async function shareCard(idx){
  const c=await drawCard(idx);
  const blob=await new Promise(r=>c.toBlob(r,'image/png'));
  const file=new File([blob],'wisdom-table.png',{type:'image/png'});
  const e=lastRun.entries[idx];
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], text:`${e.name} on "${lastRun.q}" — wisdomtable.ai`}); }catch(_){}
    return;
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='wisdom-table.png'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast('Card saved');
}

/* ── Init ── */
renderThemes(); renderVoices(); renderPresets();
$('goBtn').onclick=convene;
$('surpriseBtn').onclick=surprise;
$('addBtn').onclick=addCustom;
$('custom').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); addCustom(); }});
$('q').addEventListener('keydown',e=>{ if(e.key==='Enter' && (e.metaKey||e.ctrlKey)) convene(); });
const params=new URLSearchParams(location.search); if(params.get('q')) $('q').value=params.get('q').slice(0,600);
</script>
